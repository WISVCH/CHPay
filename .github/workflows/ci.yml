name: CI and Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build
        run: ./gradlew assemble

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: chpay
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chpay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: test,ci
      TRANSACTION_DB_URL: jdbc:postgresql://localhost:5432/chpay
      TRANSACTION_DB_USER: postgres
      TRANSACTION_DB_PASS: postgres
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Test
        run: ./gradlew test

      - name: Upload test report (HTML + XML)
        if: ${{ !cancelled() }}
        id: upload-test-report
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ github.run_id }}
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: error
          retention-days: 14

      - name: Add test report link to job summary
        if: ${{ !cancelled() }}
        run: |
          echo "### Test report" >> "$GITHUB_STEP_SUMMARY"
          echo "- HTML/XML artifact: ${{ steps.upload-test-report.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify/Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Spotless Check
        run: ./gradlew spotlessCheck

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref != 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/wisvch/chpay
          tags: |
            type=sha,prefix={{date 'YYYYMMDD'}}-

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-push:
    name: Docker Build + Push
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/wisvch/chpay
          tags: |
            type=sha,prefix={{date 'YYYYMMDD'}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dependency-graph:
    name: Dependency Graph
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Submit Dependency Graph
        uses: gradle/actions/dependency-submission@v6
