spring:
  task:
    scheduling:
      enabled: false

  application:
    baseurl: http://localhost:8080

  datasource:
    url: jdbc:h2:mem:chpay-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 2525
    username: test@chpay.invalid
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

  security:
    oauth2:
      client:
        registration:
          wisvchconnect:
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/wisvchlogin"
            scope:
              - openid
              - profile
              - email
              - student
              - auth
        provider:
          wisvchconnect:
            authorization-uri: https://example.invalid/oauth2/authorize
            token-uri: https://example.invalid/oauth2/token
            user-info-uri: https://example.invalid/userinfo
            user-name-attribute: sub
            jwk-set-uri: https://example.invalid/oauth2/jwks

mollie:
  api_key: test_mollie_key
  redirect_url: http://localhost:8080/topup/complete/
  webhook_url: http://localhost:8080/topup/status
  transaction_fee: 0.32

chpay:
  api_key: test-api-key
  admin_groups: [beheer, bestuur, vc]
  claim_name: google_groups
  transactions:
    expire_every_minutes: 20
    expiration_fixed_rate: 1
  settings:
    mintopup: 2

vite:
  mode: build
  vite-entries-prefix: src
