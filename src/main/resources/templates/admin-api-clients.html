<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}"
      th:with="layoutWide=true">
<head>
    <title>API Clients</title>
</head>
<body>
<div layout:fragment="main-content">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-base-content mb-2">API Clients</h1>
        <p class="text-base-content/70 text-lg">Manage bearer-token clients for external APIs</p>
    </div>

    <div class="card bg-base-100 shadow-lg border border-base-content/10 hover:shadow-xl transition-shadow">
        <div class="card-body p-0">
            <div
                id="api-clients-datatable"
                class="flex flex-col"
                data-datatable='{
                    "pageLength": 25,
                    "paging": true,
                    "searching": true,
                    "ordering": true,
                    "order": [[0, "asc"]],
                    "columnDefs": [
                        {
                            "targets": [1, 2, 3, 4, 5, 6],
                            "searchable": false
                        },
                        {
                            "targets": [5, 6],
                            "orderable": false
                        },
                        {
                            "targets": [6],
                            "visible": false
                        }
                    ],
                    "pagingOptions": {
                        "pageBtnClasses": "btn btn-text btn-circle btn-sm"
                    },
                    "language": {
                        "zeroRecords": "<div class=\"py-10 px-5 flex flex-col justify-center items-center text-center\"><span class=\"icon-[tabler--search] shrink-0 size-6 text-base-content\"></span><div class=\"max-w-sm mx-auto\"><p class=\"mt-2 text-sm text-base-content/80\">No API clients found</p></div></div>"
                    }
                }'
            >
                <div class="border-base-content/25 flex items-center border-b px-5 py-3 gap-3">
                    <div class="input input-sm max-w-60">
                        <span class="icon-[tabler--search] text-base-content/80 my-auto me-3 size-4 shrink-0"></span>
                        <label class="sr-only" for="api-clients-search"></label>
                        <input type="search" class="grow" placeholder="Search clients..." id="api-clients-search" />
                    </div>
                    <div class="flex flex-1 items-center justify-end gap-3">
                        <select
                            data-select='{
                                "placeholder": "Select option...",
                                "toggleTag": "<button type=\"button\" aria-expanded=\"false\"></button>",
                                "toggleClasses": "advance-select-toggle advance-select-sm",
                                "dropdownClasses": "advance-select-menu w-24 max-sm:w-16",
                                "optionClasses": "advance-select-option selected:select-active",
                                "optionTemplate": "<div class=\"flex justify-between items-center w-full\"><span data-title></span><span class=\"icon-[tabler--check] shrink-0 size-3 text-primary hidden selected:block \"></span></div>",
                                "extraMarkup": "<span class=\"icon-[tabler--caret-up-down] shrink-0 size-4 text-base-content absolute top-1/2 end-2 -translate-y-1/2 \"></span>"
                            }'
                            class="hidden"
                            data-datatable-page-entities=""
                        >
                            <option value="5">5</option>
                            <option value="10">10</option>
                            <option value="25" selected="">25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>

                        <a href="/admin/api-clients/new" class="btn btn-soft btn-primary btn-sm">
                            <span class="icon-[tabler--plus] size-4"></span>
                            New
                        </a>
                    </div>
                </div>

                <div class="w-full overflow-x-auto h-fit">
                    <table class="table">
                        <thead>
                        <tr>
                            <th scope="col" class="group">
                                <div class="flex items-center justify-between">
                                    Name
                                    <span class="icon-[tabler--chevron-up] hidden datatable-ordering-asc:block"></span>
                                    <span class="icon-[tabler--chevron-down] hidden datatable-ordering-desc:block"></span>
                                </div>
                            </th>
                            <th scope="col" class="group">
                                <div class="flex items-center justify-between">
                                    Token ID
                                    <span class="icon-[tabler--chevron-up] hidden datatable-ordering-asc:block"></span>
                                    <span class="icon-[tabler--chevron-down] hidden datatable-ordering-desc:block"></span>
                                </div>
                            </th>
                            <th scope="col" class="group">
                                <div class="flex items-center justify-between">
                                    Roles
                                    <span class="icon-[tabler--chevron-up] hidden datatable-ordering-asc:block"></span>
                                    <span class="icon-[tabler--chevron-down] hidden datatable-ordering-desc:block"></span>
                                </div>
                            </th>
                            <th scope="col" class="group">
                                <div class="flex items-center justify-between">
                                    Status
                                    <span class="icon-[tabler--chevron-up] hidden datatable-ordering-asc:block"></span>
                                    <span class="icon-[tabler--chevron-down] hidden datatable-ordering-desc:block"></span>
                                </div>
                            </th>
                            <th scope="col" class="group">
                                <div class="flex items-center justify-between">
                                    Last Used
                                    <span class="icon-[tabler--chevron-up] hidden datatable-ordering-asc:block"></span>
                                    <span class="icon-[tabler--chevron-down] hidden datatable-ordering-desc:block"></span>
                                </div>
                            </th>
                            <th scope="col" class="w-auto --exclude-from-ordering">Actions</th>
                            <th scope="col" class="w-auto --exclude-from-ordering" style="display: none;">ID</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="apiClient : ${apiClients}">
                            <td th:text="${apiClient.name}">Client Name</td>
                            <td>
                                <span class="font-mono text-sm" th:text="${apiClient.tokenId}">token-id</span>
                            </td>
                            <td>
                                <div class="flex flex-wrap gap-1">
                                    <span class="badge badge-soft badge-info badge-sm"
                                          th:if="${apiClient.roles.contains(T(ch.wisv.chpay.api.client.model.ApiClientRole).EXTERNAL_PAYMENT)}">
                                        External Payment
                                    </span>
                                    <span class="badge badge-soft badge-secondary badge-sm"
                                          th:if="${apiClient.roles.contains(T(ch.wisv.chpay.api.client.model.ApiClientRole).LEDSTRIP)}">
                                        Ledstrip
                                    </span>
                                </div>
                            </td>
                            <td>
                                <span class="badge badge-soft badge-success" th:if="${apiClient.enabled}">Enabled</span>
                                <span class="badge badge-soft badge-error" th:unless="${apiClient.enabled}">Disabled</span>
                            </td>
                            <td th:if="${apiClient.lastUsedAt != null}"
                                th:text="${#temporals.format(apiClient.lastUsedAt, 'dd-MM-yyyy HH:mm:ss')}">01-01-2026 12:00:00</td>
                            <td th:unless="${apiClient.lastUsedAt != null}">Never</td>
                            <td>
                                <a th:href="@{/admin/api-clients/{id}(id=${apiClient.id})}"
                                   class="btn btn-circle btn-text btn-sm"
                                   title="View details">
                                    <span class="icon-[tabler--eye] size-5"></span>
                                </a>
                            </td>
                            <td style="display: none;" th:text="${apiClient.id}">client-id</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="border-base-content/25 flex items-center justify-between gap-3 border-t p-3 max-md:flex-wrap max-md:justify-center">
                    <div class="text-sm text-base-content/80" data-datatable-info="">
                        Showing
                        <span data-datatable-info-from=""></span>
                        to
                        <span data-datatable-info-to=""></span>
                        of
                        <span data-datatable-info-length=""></span>
                        API clients
                    </div>
                    <div class="flex hidden items-center space-x-1" data-datatable-paging="">
                        <button type="button" class="btn btn-text btn-circle btn-sm" data-datatable-paging-prev="">
                            <span class="icon-[tabler--chevrons-left] size-4.5 rtl:rotate-180"></span>
                            <span class="sr-only">Previous</span>
                        </button>
                        <div class="flex items-center space-x-1 [&>.active]:text-bg-soft-primary" data-datatable-paging-pages=""></div>
                        <button type="button" class="btn btn-text btn-circle btn-sm" data-datatable-paging-next="">
                            <span class="sr-only">Next</span>
                            <span class="icon-[tabler--chevrons-right] size-4.5 rtl:rotate-180"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const dataTable = new DataTable('#api-clients-datatable table');
                const searchInput = document.getElementById('api-clients-search');

                if (searchInput) {
                    searchInput.addEventListener('input', () => {
                        dataTable.columns().search('');
                        dataTable.column(0).search(searchInput.value).draw();
                    });
                }
            }, 100);
        });
    </script>
</th:block>
</body>
</html>
