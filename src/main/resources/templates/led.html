<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>LED Settings</title>
</head>

<body>
<div layout:fragment="main-content">
    <div class="container max-w-2xl mx-auto">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-base-content mb-2">LED Settings</h1>
            <p class="text-base-content/70 text-lg">Customize your LED strip color and pattern</p>
        </div>

        <div class="card bg-base-100 border border-base-content/10 shadow-sm">
            <div class="card-body">
                <form id="led-form" th:action="@{/led/save}" method="post">
                    <input type="hidden" name="r" id="input-r" th:value="${currentUser.ledR != null} ? ${currentUser.ledR} : 255">
                    <input type="hidden" name="g" id="input-g" th:value="${currentUser.ledG != null} ? ${currentUser.ledG} : 255">
                    <input type="hidden" name="b" id="input-b" th:value="${currentUser.ledB != null} ? ${currentUser.ledB} : 255">

                    <div class="mb-6">
                        <label class="label mb-2">
                            <span class="label-text font-semibold text-base">Color</span>
                        </label>
                        <div class="flex items-center gap-4">
                            <input type="color" id="color-picker" class="w-16 h-16 rounded-lg cursor-pointer border border-base-content/20 p-1 bg-base-100">
                            <div class="text-base-content/70 text-sm">
                                <span id="color-hex">#ffffff</span>
                            </div>
                        </div>
                    </div>

                    <div class="mb-8">
                        <label class="label mb-2">
                            <span class="label-text font-semibold text-base">Pattern</span>
                        </label>
                        <div class="grid gap-3 sm:grid-cols-2">
                            <label th:each="p : ${patterns}"
                                   class="flex items-center gap-3 p-3 rounded-lg border border-base-content/10 cursor-pointer hover:bg-base-200 transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary/5">
                                <input type="radio"
                                       name="pattern"
                                       class="radio radio-primary radio-sm"
                                       th:value="${p.name()}"
                                       th:checked="${currentUser.ledPattern != null and currentUser.ledPattern == p}">
                                <span class="text-sm font-medium" th:text="${p.name()}">pattern</span>
                            </label>
                        </div>
                    </div>

                    <div class="flex justify-end">
                        <button type="submit" class="btn btn-primary">
                            <span class="icon-[tabler--device-floppy] size-5"></span>
                            Save
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        (function () {
            const r = /*[[${currentUser.ledR != null} ? ${currentUser.ledR} : 255]]*/ 255;
            const g = /*[[${currentUser.ledG != null} ? ${currentUser.ledG} : 255]]*/ 255;
            const b = /*[[${currentUser.ledB != null} ? ${currentUser.ledB} : 255]]*/ 255;

            function toHex(v) {
                return v.toString(16).padStart(2, '0');
            }

            function rgbToHex(r, g, b) {
                return '#' + toHex(r) + toHex(g) + toHex(b);
            }

            const picker = document.getElementById('color-picker');
            const hexLabel = document.getElementById('color-hex');
            const inputR = document.getElementById('input-r');
            const inputG = document.getElementById('input-g');
            const inputB = document.getElementById('input-b');

            picker.value = rgbToHex(r, g, b);
            hexLabel.textContent = picker.value;

            picker.addEventListener('input', function () {
                const hex = picker.value;
                hexLabel.textContent = hex;
                inputR.value = parseInt(hex.slice(1, 3), 16);
                inputG.value = parseInt(hex.slice(3, 5), 16);
                inputB.value = parseInt(hex.slice(5, 7), 16);
            });
        })();
    </script>
</th:block>
</body>
</html>
