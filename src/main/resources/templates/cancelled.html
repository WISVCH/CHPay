<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${isTopup} ? 'Top-up Cancelled' : 'Payment Cancelled'">Payment Cancelled</title>
</head>
<body>
    <div layout:fragment="main-content">
        <div class="container max-w-2xl mx-auto py-8">
            <!-- Cancelled Payment Card -->
            <div class="card bg-base-100 shadow-lg border border-base-content/10 hover:shadow-xl transition-shadow">
                <div class="card-body text-center p-8">
                    <!-- Cancel Icon -->
                    <div class="flex justify-center mb-8">
                        <div class="avatar avatar-placeholder">
                            <div class="bg-error/20 text-error size-20 rounded-full">
                                <span class="icon-[tabler--x] size-10"></span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Title -->
                    <h1 class="text-3xl font-bold text-base-content mb-4" th:text="${isTopup} ? 'Top-up Cancelled' : 'Payment Cancelled'">Payment Cancelled</h1>
                    
                    <!-- Balance Status -->
                    <div class="mb-8">
                        <div class="stat-value text-base-content text-4xl mb-2">
                            €<span th:text="${#numbers.formatDecimal(currentUser.balance, 1, 2)}">0.00</span>
                        </div>
                        <p class="text-base-content/70 text-lg">
                            Your balance remains unchanged
                        </p>
                    </div>

                    <!-- Action Buttons -->
                    <div class="grid grid-rows-2 sm:grid-cols-2 sm:grid-rows-1 gap-4 w-full mb-6">
                        <a href="/" class="btn btn-primary btn-xl sm:btn-lg">
                            <span class="icon-[tabler--home] size-5"></span>
                            Go to Homepage
                        </a>
                        <a href="/topup" class="btn btn-outline btn-m sm:btn-lg">
                            <span class="icon-[tabler--plus] size-5"></span>
                            Top-Up Balance
                        </a>
                    </div>

                    <!-- Transaction ID -->
                    <div class="text-xs text-base-content/50">
                        <span th:text="${'Transaction ID: ' + transactionID}">Transaction ID: TX-123456</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
