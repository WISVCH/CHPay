<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Payment</title>
</head>
<body>
    <div layout:fragment="main-content">
        <div class="container max-w-2xl mx-auto py-8">
            <!-- Payment Card -->
            <div class="card bg-base-100 shadow-lg border border-base-content/10 hover:shadow-xl transition-shadow">
                <div class="card-body text-center p-8">
                    <!-- Price at the top -->
                    <div class="stat-value text-primary text-6xl mb-8 mt-4">
                        €<span th:text="${#numbers.formatDecimal(transaction.amount.abs(), 1, 2)}">0.00</span>
                    </div>
                    
                    <!-- Purchase description -->
                    <h2 class="card-title text-2xl justify-center mb-8" th:text="${transaction.description}">Product Name</h2>
                    
                    <!-- Current balance -->
                    <div class="text-base-content/70 mb-8 flex items-center justify-center gap-2">
                        <span class="icon-[tabler--wallet] size-4"></span>
                        <span>Available Balance: €<span th:text="${#numbers.formatDecimal(currentUser.balance, 1, 2)}">0.00</span></span>
                    </div>

                    <!-- Insufficient Funds Warning -->
                    <div th:if="${transaction.amount.abs()}>${currentUser.balance}" 
                         class="alert alert-soft alert-warning flex items-center gap-4 mb-8" role="alert">
                        <span class="icon-[tabler--alert-triangle] shrink-0 size-6"></span>
                        <p><span class="font-bold">Insufficient funds.</span> Need additional 
                            €<span th:text="${#numbers.formatDecimal(transaction.amount.abs() - currentUser.balance, 1, 2)}">0.00</span>
                        </p>
                    </div>

                    <!-- Action buttons -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">
                        <!-- Pay Button (row 1 on desktop, full width always) -->
                        <form th:if="${transaction.amount.abs()}<=${currentUser.balance}"
                              th:action="@{/payment/pay}"
                              method="post"
                              class="sm:col-span-2">
                            <input type="hidden" name="tx" th:value="${transaction.id}" />
                            <button type="submit" class="btn btn-primary btn-xl sm:btn-lg w-full">
                                Pay
                            </button>
                        </form>
                        <a th:unless="${transaction.amount.abs()}<=${currentUser.balance}"
                           class="btn btn-primary btn-xl sm:btn-lg w-full btn-disabled sm:col-span-2"
                           aria-disabled="true">
                            Pay
                        </a>

                        <!-- Top-Up Button (row 2 on desktop) -->
                        <a th:href="@{/topup(redirect=${transaction.id})}" class="btn btn-outline btn-m sm:btn-lg w-full">
                            <span class="icon-[tabler--plus] size-5"></span>
                            Top-Up Balance
                        </a>

                        <!-- Cancel Button (row 2 on desktop) -->
                        <form th:action="@{/payment/cancel}" method="post">
                            <input type="hidden" name="tx" th:value="${transaction.id}" />
                            <button type="submit" class="btn btn-outline btn-error btn-m sm:btn-lg w-full">
                                <span class="icon-[tabler--x] size-5"></span>
                                Cancel Payment
                            </button>
                        </form>
                    </div>

                    <!-- Transaction ID -->
                    <div class="text-xs text-base-content/50 mt-6">
                        <span th:text="${'Transaction ID: ' + transaction.id}">Transaction ID: TX-123456</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
