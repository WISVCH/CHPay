<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Confetti</title>
</head>

<body>
<div layout:fragment="main-content">
    <div class="container max-w-6xl mx-auto">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-base-content mb-2">Confetti</h1>
            <p class="text-base-content/70 text-lg">Choose the confetti you want to use</p>
        </div>

        <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
            <div th:each="card : ${confettiCards}"
                 class="card bg-base-100 border border-base-content/10 shadow-sm hover:shadow-md transition-shadow"
                 th:classappend="${card.unlocked} ? ' cursor-pointer' : ' opacity-60 cursor-not-allowed'"
                 th:attr="data-confetti-card=${card.unlocked} ? 'true' : null">
                <div class="card-body">
                    <div class="flex items-center gap-3">
                        <span th:if="${card.unlocked}" class="icon-[tabler--sparkles] size-6 text-primary"></span>
                        <span th:if="${!card.unlocked}" class="icon-[tabler--lock] size-6 text-base-content/70"></span>
                        <h3 class="card-title text-base" th:text="${card.confetti.name}">Confetti</h3>
                    </div>
                    <p class="text-sm text-base-content/70 mt-1"
                       th:if="${card.confetti.minimumTransactions > 0}"
                       th:text="'Requires ' + ${card.confetti.minimumTransactions} + ' ' + (${card.confetti.minimumTransactions} == 1 ? 'transaction' : 'transactions')">
                        Requires 0 transactions
                    </p>

                    <div class="mt-4 flex items-center justify-between">
                        <form th:if="${card.unlocked}"
                              th:action="@{/confetti/{id}/equip(id=${card.confetti.id})}"
                              method="post"
                              class="ml-auto">
                            <button type="submit"
                                    class="btn btn-primary btn-sm"
                                    th:if="${selectedConfettiId == null or selectedConfettiId != card.confetti.id}">
                                Equip
                            </button>
                            <button type="button"
                                    class="btn btn-ghost btn-sm"
                                    th:if="${selectedConfettiId != null and selectedConfettiId == card.confetti.id}"
                                    disabled>
                                Equipped
                            </button>
                        </form>
                        <button type="button"
                                class="btn btn-ghost btn-sm ml-auto"
                                th:if="${!card.unlocked}"
                                disabled>
                            Locked
                        </button>
                    </div>

                    <div class="hidden" data-confetti-meta
                         th:if="${card.unlocked}"
                         th:attr="data-confetti-scalar=${card.confetti.scalar}">
                        <span th:each="color : ${card.confetti.colors}"
                              data-confetti-color
                              th:attr="data-confetti-color=${color}"></span>
                        <span th:each="shape : ${card.confetti.shapes}"
                              data-confetti-shape
                              th:attr="data-confetti-shape-type=${shape.type}, data-confetti-shape-value=${shape.value}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/canvas-confetti.browser.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const randomInRange = (min, max) => Math.random() * (max - min) + min;

            const buildShapes = (meta, scalar) => {
                const shapeElements = Array.from(meta.querySelectorAll('[data-confetti-shape]'));
                const shapes = [];

                shapeElements.forEach(element => {
                    const type = element.dataset.confettiShapeType;
                    const value = element.dataset.confettiShapeValue || '';

                    if (type === 'SQUARE') {
                        shapes.push('square');
                        return;
                    }
                    if (type === 'CIRCLE') {
                        shapes.push('circle');
                        return;
                    }
                    if (type === 'STAR') {
                        shapes.push('star');
                        return;
                    }
                    if (type === 'PATH' && value.trim().length > 0) {
                        shapes.push(confetti.shapeFromPath({ path: value }));
                        return;
                    }
                    if (type === 'TEXT' && value.trim().length > 0) {
                        shapes.push(confetti.shapeFromText({ text: value, scalar: scalar }));
                    }
                });

                return shapes;
            };

            const getColors = (meta) => Array.from(meta.querySelectorAll('[data-confetti-color]'))
                .map(element => element.dataset.confettiColor)
                .filter(color => color && color.length > 0);

            document.querySelectorAll('[data-confetti-card="true"]').forEach(card => {
                card.addEventListener('click', event => {
                    if (event.target.closest('button, a, form')) {
                        return;
                    }

                    const meta = card.querySelector('[data-confetti-meta]');
                    if (!meta || typeof confetti !== 'function') {
                        return;
                    }

                    const scalarValue = Number.parseFloat(meta.dataset.confettiScalar);
                    const scalar = Number.isFinite(scalarValue) && scalarValue > 0 ? scalarValue : 1;
                    const shapes = buildShapes(meta, scalar);
                    const colors = getColors(meta);
                    const originX = event.clientX / window.innerWidth;
                    const originY = event.clientY / window.innerHeight;

                    confetti({
                        angle: randomInRange(55, 125),
                        spread: randomInRange(50, 70),
                        particleCount: randomInRange(50, 100),
                        origin: { x: originX, y: originY },
                        colors: colors.length > 0 ? colors : undefined,
                        shapes: shapes.length > 0 ? shapes : undefined,
                        scalar: scalar
                    });
                });
            });
        });
    </script>
</th:block>
</body>
</html>
