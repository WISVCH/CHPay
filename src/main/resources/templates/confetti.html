<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Confetti</title>
</head>

<body>
<div layout:fragment="main-content">
    <div class="container max-w-6xl mx-auto">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-base-content mb-2">Confetti</h1>
            <p class="text-base-content/70 text-lg">Choose the confetti you want to use</p>
        </div>

        <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
            <div th:each="card : ${confettiCards}"
                 class="card bg-base-100 border border-base-content/10 shadow-sm hover:shadow-md transition-shadow"
                 th:classappend="${!card.unlocked} ? ' opacity-60 cursor-not-allowed' : ''">
                <div class="card-body">
                    <div class="flex items-center gap-3">
                        <span th:if="${card.unlocked}" class="icon-[tabler--sparkles] size-6 text-primary"></span>
                        <span th:if="${!card.unlocked}" class="icon-[tabler--lock] size-6 text-base-content/70"></span>
                        <h3 class="card-title text-base" th:text="${card.confetti.name}">Confetti</h3>
                        <!-- Color dots -->
                        <div class="flex items-center -space-x-1 ml-auto" th:if="${card.unlocked}">
                            <div th:if="${card.confetti.ledColor != (card.confetti.colors.isEmpty() ? null : card.confetti.colors[0])}"
                                 class="w-3.5 h-3.5 rounded-full border border-base-100 ring-1 ring-base-content/20 shrink-0"
                                 th:style="${'background-color: ' + card.confetti.ledColor + '; z-index: 50'}"></div>
                            <div th:each="color, s : ${card.confetti.colors}"
                                 class="w-3.5 h-3.5 rounded-full border border-base-100 ring-1 ring-base-content/20 shrink-0"
                                 th:style="${'background-color: ' + color + '; z-index: ' + (49 - s.index)}"></div>
                        </div>
                        <div class="flex items-center -space-x-1 ml-auto" th:if="${!card.unlocked}">
                            <div class="w-3.5 h-3.5 rounded-full border border-base-100 ring-1 ring-base-content/20 shrink-0" style="z-index: 3; background-color: color-mix(in srgb, var(--color-base-content) 25%, var(--color-base-100))"></div>
                            <div class="w-3.5 h-3.5 rounded-full border border-base-100 ring-1 ring-base-content/20 shrink-0" style="z-index: 2; background-color: color-mix(in srgb, var(--color-base-content) 25%, var(--color-base-100))"></div>
                            <div class="w-3.5 h-3.5 rounded-full border border-base-100 ring-1 ring-base-content/20 shrink-0" style="z-index: 1; background-color: color-mix(in srgb, var(--color-base-content) 25%, var(--color-base-100))"></div>
                        </div>
                    </div>
                    <p class="text-sm text-base-content/70 mt-1 min-h-[1.25rem]"
                       th:text="${card.confetti.minimumTransactions > 0} ? 'Requires ' + ${card.confetti.minimumTransactions} + ' ' + (${card.confetti.minimumTransactions} == 1 ? 'transaction' : 'transactions') : ''">
                        Requires 0 transactions
                    </p>

                    <div class="mt-4 flex items-center">
                        <form th:if="${card.unlocked}"
                              th:action="@{/confetti/{id}/equip(id=${card.confetti.id})}"
                              method="post"
                              class="ml-auto flex items-center gap-4">
                            <a href="#" class="link text-sm" data-confetti-preview>Preview</a>
                            <button type="submit"
                                    class="btn btn-primary btn-sm"
                                    th:if="${selectedConfettiId == null or selectedConfettiId != card.confetti.id}">
                                Equip
                            </button>
                            <button type="button"
                                    class="btn btn-ghost btn-sm"
                                    th:if="${selectedConfettiId != null and selectedConfettiId == card.confetti.id}"
                                    disabled>
                                Equipped
                            </button>
                        </form>
                        <button type="button"
                                class="btn btn-ghost btn-sm ml-auto"
                                th:if="${!card.unlocked}"
                                disabled>
                            Locked
                        </button>
                    </div>

                    <div class="hidden" data-confetti-meta
                         th:if="${card.unlocked}"
                         th:attr="data-confetti-scalar=${card.confetti.scalar}">
                        <span th:each="color : ${card.confetti.colors}"
                              data-confetti-color
                              th:attr="data-confetti-color=${color}"></span>
                        <span th:each="shape : ${card.confetti.shapes}"
                              data-confetti-shape
                              th:attr="data-confetti-shape-type=${shape.type}, data-confetti-shape-value=${shape.value}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/confetti-shared.js}"></script>
    <script>
        confettiUtils.bindPreviewButtons({ rowSelector: '.card' });
    </script>
</th:block>
</body>
</html>
